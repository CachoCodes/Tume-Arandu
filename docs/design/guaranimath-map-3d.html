<script>
// One world, one camera. Every scene point is world (x,y,z); UI chrome alone is screen space.
// ?camera=ortho gives the old parallel projection, default is a mild perspective camera.
const radians=degrees=>degrees*Math.PI/180;
const params=new URLSearchParams(location.search);
const PERSPECTIVE=params.get('camera')!=='ortho';
const GRASS=params.get('ground')!=='plain';
document.body.classList.toggle('grass',GRASS);
const SHADOW=GRASS?'#1a4210':'#23465e';
let SHADOW_PLANE=0; // receiving plane for cast shadows (raised while drawing an object on its plinth)
const CAMERA={azimuth:radians(45),elevation:radians(40),scale:Math.sqrt(1.5),origin:[195,429],distance:+params.get('distance')||2400};
const ca=Math.cos(CAMERA.azimuth),sa=Math.sin(CAMERA.azimuth),ce=Math.cos(CAMERA.elevation),se=Math.sin(CAMERA.elevation);
const f=n=>+n.toFixed(2);
const add=(a,b)=>a.map((v,i)=>v+(b[i]||0));
const sub=(a,b)=>a.map((v,i)=>v-(b[i]||0));
const scaleV=(a,k)=>a.map(v=>v*k);
const dot=(a,b)=>a.reduce((sum,v,i)=>sum+v*b[i],0);
const norm=a=>scaleV(a,1/Math.hypot(...a));
const rotateZ=([x,y,z=0],angle)=>[x*Math.cos(angle)-y*Math.sin(angle),x*Math.sin(angle)+y*Math.cos(angle),z];
// Camera basis: right on screen, camera up, towards the camera.
const RIGHT=[ca,-sa,0],UP=[-sa*se,-ca*se,ce],VIEW=[sa*ce,ca*ce,se],TOWARD_VIEWER=[sa,ca,0];
// Layout is authored in "map pixels" (x across, y down the scrolling map) and dropped onto the ground once.
const mapToWorld=([px,py])=>{const x=(px-CAMERA.origin[0])/CAMERA.scale,y=(py-CAMERA.origin[1])/(CAMERA.scale*se);return[ca*x+sa*y,-sa*x+ca*y,0]};
let TARGET=mapToWorld(CAMERA.origin),EYE=add(TARGET,scaleV(VIEW,CAMERA.distance));
let CURRENT_SCROLL=0;const TARGET_MAP_Y=()=>CAMERA.origin[1]+CURRENT_SCROLL;
const setScroll=y=>{CURRENT_SCROLL=y;TARGET=mapToWorld([CAMERA.origin[0],CAMERA.origin[1]+y]);EYE=add(TARGET,scaleV(VIEW,CAMERA.distance))};
const toCamera=p=>{const r=sub(p,TARGET);return[dot(r,RIGHT),dot(r,UP),dot(r,VIEW)]};
const project=p=>{const [x,y,z]=toCamera(p),k=PERSPECTIVE?CAMERA.distance/(CAMERA.distance-z):1;return[CAMERA.origin[0]+CAMERA.scale*k*x,CAMERA.origin[1]-CAMERA.scale*k*y]};
const depthOf=p=>toCamera(p)[2];
// A face is visible when it turns towards the eye (perspective) or the view direction (ortho).
const facesCamera=(normal,at)=>dot(normal,PERSPECTIVE?sub(EYE,at):VIEW)>1e-9;
// Local affine frame of a world plane at point p: text/decal units map to world axes a and b.
const frameAt=(p,a,b)=>{const o=project(p),u=sub(project(add(p,a)),o),v=sub(project(add(p,b)),o);return `matrix(${[...u,...v,...o].map(f).join(' ')})`};
const pts=ps=>ps.map(p=>p.map(f).join(',')).join(' ');
const poly2=(ps,fill,extra='')=>`<polygon points="${pts(ps)}" fill="${fill}" ${extra}/>`;
const poly=(ps,fill,extra='')=>poly2(ps.map(project),fill,extra);
const label=(x,y,s,size=11,extra='')=>`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" font-size="${size}" font-weight="650" ${extra}>${s}</text>`;

// Key light upper-left, a little in front of the scene: left faces lit, shadows fall back-right.
const lightElevation=radians(55);
const LIGHT=norm(add(scaleV(norm(add(scaleV(RIGHT,-.62),scaleV(TOWARD_VIEWER,.45))),Math.cos(lightElevation)),[0,0,Math.sin(lightElevation)]));
const AMBIENT=.7,DIFFUSE=.3,TOP_LIGHT=AMBIENT+DIFFUSE*LIGHT[2];
const intensity=n=>(AMBIENT+DIFFUSE*Math.max(0,dot(n,LIGHT)))/TOP_LIGHT;
const tint=(hex,k)=>'#'+hex.slice(1).match(/../g).map(c=>Math.min(255,Math.round(parseInt(c,16)*k)).toString(16).padStart(2,'0')).join('');
const castShadow=([x,y,z=0],planeZ=0)=>[x-(z-planeZ)*LIGHT[0]/LIGHT[2],y-(z-planeZ)*LIGHT[1]/LIGHT[2],planeZ];
const hull=input=>{const s=[...input].sort((a,b)=>a[0]-b[0]||a[1]-b[1]),cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
 for(const p of s){while(lo.length>1&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 for(const p of s.reverse()){while(up.length>1&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 return lo.slice(0,-1).concat(up.slice(0,-1))};

let defs='',uid=0;
// Shadow = hull of the solid dropped along the light, fading from the contact (dark, sharp) to the tip (light).
function shadowShape(vertices,from,to,planeZ=SHADOW_PLANE,extra=''){
 const id='sh'+(uid++),a=project(castShadow(from,planeZ)),b=project(castShadow(to,planeZ));
 defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"><stop offset="0" stop-color="${SHADOW}" stop-opacity="${GRASS?.36:.2}"/><stop offset="1" stop-color="${SHADOW}" stop-opacity="${GRASS?.12:.05}"/></linearGradient>`;
 return poly2(hull(vertices.map(v=>project(castShadow(v,planeZ)))),`url(#${id})`,`filter="url(#soft)" ${extra}`);
}
const SEGMENTS=56;
const ring=(c,r,z)=>Array.from({length:SEGMENTS},(_,i)=>add(c,[r*Math.cos(i*2*Math.PI/SEGMENTS),r*Math.sin(i*2*Math.PI/SEGMENTS),z]));
// Ambient occlusion right where a solid touches the ground.
const contact=(c,r)=>poly(ring(c,r+1,0),SHADOW,`fill-opacity="${GRASS?.32:.2}"`+' filter="url(#contact)"');
// Cylinder: silhouette = hull of both rims, side shaded by the real normal across the visible arc.
function cylinder(c,r,h,material){
 const top=ring(c,r,h),bottom=ring(c,r,0),side=hull([...top,...bottom].map(project)),xs=side.map(p=>p[0]),id='cy'+(uid++);
 const stops=Array.from({length:9},(_,i)=>{const phi=Math.PI*(1-i/8),n=add(scaleV(RIGHT,Math.cos(phi)),scaleV(TOWARD_VIEWER,Math.sin(phi)));return `<stop offset="${f((1+Math.cos(phi))/2)}" stop-color="${tint(material,intensity(n)*.93)}"/>`}).join('');
 defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f(Math.min(...xs))}" x2="${f(Math.max(...xs))}" y1="0" y2="0">${stops}</linearGradient>`;
 // Near rim highlight: the top-edge points whose side normal turns to the camera, in ring order.
 const seen=top.map((p,i)=>facesCamera([Math.cos(i*2*Math.PI/SEGMENTS),Math.sin(i*2*Math.PI/SEGMENTS),0],p));
 const start=seen.findIndex((v,i)=>v&&!seen[(i+SEGMENTS-1)%SEGMENTS]),arc=[];
 for(let k=0;k<SEGMENTS&&start>=0;k++){const i=(start+k)%SEGMENTS;if(!seen[i])break;arc.push(project(top[i]))}
 return poly2(side,`url(#${id})`)+poly(top,material)+`<polyline points="${pts(arc)}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width=".8" stroke-linecap="round"/>`;
}

// ---------- Layout: stages. One stage = one screen: 3 lessons (new knowledge), each followed by 2–3 reviews ----------
const SCREEN=864,STAGE_TOP=226,STAGE_BOTTOM=600,TROPHY_Y=688;
// L = lesson, R = review. Each stage bends its own way.
const STAGES=[{dir:1,amp:92,types:'LRRLRRLRR'},{dir:-1,amp:88,types:'LRRRLRRLR'},{dir:1,amp:96,types:'LRRLRRRLR'}];
const NODES=STAGES.flatMap((S,s)=>[...S.types].map((t,k)=>({stage:s,k,lesson:t==='L',n:S.types.length})));
const LESSONS=NODES.length,DONE=Math.min(NODES.length,+params.get('progress')||2),CURRENT=DONE; // stage 1: lesson 1 and a review done, the next review is current
const RADIUS=30,REVIEW_RADIUS=21,TILE_HEIGHT=8;
const SNAKE={center:195};
const mapX=i=>{const N=NODES[i],S=STAGES[N.stage];return SNAKE.center+S.dir*S.amp*Math.sin(N.k*2*Math.PI/(N.n-1))};
const mapY=i=>{const N=NODES[i];return N.stage*SCREEN+STAGE_TOP+N.k*(STAGE_BOTTOM-STAGE_TOP)/(N.n-1)};
const lessons=NODES.map((_,i)=>mapToWorld([mapX(i),mapY(i)]));
const radiusOf=i=>NODES[i].lesson?RADIUS:REVIEW_RADIUS;
const isFinal=()=>false;
const MAP_HEIGHT=STAGES.length*SCREEN;
const material=i=>i<DONE?(GRASS?'#ffd84d':'#bde797'):i===CURRENT?(GRASS?'#8fd8ff':'#d7f2ff'):(GRASS?'#f2f5f7':'#edf4f8');
// Bays: the free side next to each hump of the snake (upper hump ≈ node 2, lower hump ≈ node 6).
const bay=(s,which)=>{const S=STAGES[s],base=NODES.findIndex(N=>N.stage===s),k=which==='upper'?2:6,side=which==='upper'?-S.dir:S.dir;return[SNAKE.center+side*S.amp,mapY(base+k)]};
const lessonNumber=i=>NODES.slice(0,i+1).filter(N=>N.stage===NODES[i].stage&&N.lesson).length;

// ---------- Solids ----------
const centroid=ps=>scaleV(ps.reduce((a,b)=>add(a,b)),1/ps.length);
const EDGE='stroke-linejoin="round"';
// Convex polyhedron: draw exactly the faces that turn towards the camera, Lambert-shaded.
function solid(faces,matl,stroke){
 const mid=centroid(faces.flatMap(face=>face.ps));
 return faces.map(face=>{let n=face.n||norm(cross(sub(face.ps[1],face.ps[0]),sub(face.ps[2],face.ps[0])));
  if(dot(n,sub(centroid(face.ps),mid))<0)n=scaleV(n,-1); // always outward
  return facesCamera(n,centroid(face.ps))?poly(face.ps,tint(face.matl||matl,intensity(n)),`stroke="${stroke}" stroke-width=".7" ${EDGE}`):''}).join('');
}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

// Extruded vertical sculpture (letters, ring, wave): the same 2D drawing stacked from back to front.
// 2D units: x along the plane, y down (0 = foot of the piece). "currentColor" gets the layer colour.
function extruded(E){
 const ex=rotateZ(RIGHT,E.yaw),ez=[0,0,-1],back=rotateZ(scaleV(TOWARD_VIEWER,-1),E.yaw),at=k=>add(E.origin,scaleV(back,E.depth*k));
 const sideTone=E.side||tint(E.color,.7);
 let s='';const n=E.layers||12;
 for(let k=n;k>=1;k--)s+=`<g transform="${frameAt(at(k/n),ex,ez)}" color="${k===1?tint(E.color,.82):sideTone}">${E.draw}</g>`;
 s+=`<g transform="${frameAt(at(0),ex,ez)}" color="${E.color}"${E.edge?` stroke="${E.edge}" stroke-width=".45" paint-order="stroke"`:''}>${E.draw}${E.front||''}</g>`;
 return s;
}
// Its shadow: the drawing sheared onto the ground along the light (text y = −height).
function extrudedShadow(E){
 const ex=rotateZ(RIGHT,E.yaw),down=[LIGHT[0]/LIGHT[2],LIGHT[1]/LIGHT[2],0],back=rotateZ(scaleV(TOWARD_VIEWER,-1),E.yaw);
 const o=k=>castShadow(add(E.origin,scaleV(back,E.depth*k)),SHADOW_PLANE);
 const cast=[0,.5,1].map(k=>`<g transform="${frameAt(o(k),ex,down)}" color="${SHADOW}" opacity="${GRASS?.16:.12}" filter="url(#soft)">${E.draw}</g>`).join('');
 // Contact: the drawing flattened onto the ground right at its foot (every glyph touches down).
 const foot=`<g transform="${frameAt(o(.5),ex,scaleV(back,.2))}" color="${SHADOW}" opacity=".28" filter="url(#soft)">${E.draw}</g>`;
 return cast+foot;
}

// Every sculpture is trigonometry, and each has its own colour.
const line3=(ps,stroke,width,extra='')=>`<polyline points="${pts(ps.map(project))}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const lineShadow=(ps,width)=>line3(ps.map(p=>castShadow(p,SHADOW_PLANE)),SHADOW,width,'stroke-opacity=".13" filter="url(#soft)"');
// Screen-facing label pinned to a world point (for letters like h, θ that name parts of a figure).
const tag=(p,t,size,color,dx=0,dy=0)=>{const q=project(p);return `<text x="${f(q[0]+dx)}" y="${f(q[1]+dy+size*.35)}" text-anchor="middle" font-size="${size}" font-weight="700" font-style="italic" style="fill:${color}">${t}</text>`};

// 1. Unit 1, left bay — the 30-60-90 prism (pastel mint), mirrored: right angle on the left, the 30° tip points right.
function prismProp(P){
 const M=P.mirror?-1:1;
 const world=([x,y,z])=>add(P.center,rotateZ([M*(x-P.w/2-2)*P.scale,y,z*P.scale+P.plinth],P.yaw));

 const rot=n=>rotateZ(n,P.yaw);

// Area the ground must cover: every screen corner, at the first and last scroll position.
const LAWN=(()=>{if(!GRASS)return null;

 for(const s of [0,maxScroll/2,maxScroll]){setScroll(s);const Hi=invertH(groundH());for(const c of [[0,0],[390,0],[0,864],[390,864]]){const m=applyH(Hi,c);xs.push(m[0]);ys.push(m[1])}}

 const x0=Math.floor(Math.min(...xs))-24,y0=Math.floor(Math.min(...ys))-24,w=Math.ceil(Math.max(...xs))+24-x0,h=Math.ceil(Math.max(...ys))+24-y0;
 return{x0,y0,w,h,res:Math.min(3.8,Math.sqrt(14e6/(w*h)))};

// Where flowers must not grow: plinth footprints, a margin, and the ground a tall piece hides behind it.
const segDist2=(p,a,b)=>{const d=sub(b,a),t=Math.max(0,Math.min(1,dot(sub(p,a),d)/dot(d,d)));return Math.hypot(...sub(p,add(a,scaleV(d,t))).slice(0,2))};

function paintLawn(){
 const L=LAWN,cv=document.createElement('canvas');

 const ctx=cv.getContext('2d');ctx.scale(L.res,L.res);ctx.translate(-L.x0,-L.y0);
 let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const lessonsMap=lessons.map((c,i)=>({p:mapToScreen0(c),r:radiusOf(i)*CAMERA.scale}));
 // Stylised lawn to match the flat-shaded sculptures: one clean green, a few soft patches, sparse simple tufts.
 ctx.fillStyle='#7cc957';ctx.fillRect(L.x0,L.y0,L.w,L.h);

 for(let i=0;i<L.w*L.h/5200;i++){const x=L.x0+rnd()*L.w,y=L.y0+rnd()*L.h,c=rnd()<.5?'#86d261':'#72bf4f';for(let k=0;k<3;k++)patch(x+(rnd()-.5)*40,y+(rnd()-.5)*22,16+rnd()*26,c)}

 const nearPath=(x,y,m)=>pathPts.slice(1).some((b,i)=>{if(NODES[i].stage!==NODES[i+1].stage)return false;const a=pathPts[i],d=[b[0]-a[0],b[1]-a[1]],t=Math.max(0,Math.min(1,((x-a[0])*d[0]+(y-a[1])*d[1])/(d[0]*d[0]+d[1]*d[1])));return Math.hypot(x-a[0]-d[0]*t,y-a[1]-d[1]*t)<m});

 // Tufts vary: 1–6 blades, own fan angle, height, width and a shade picked per tuft; some grow in small groups.
 const SHADES=[['#4a9a31','#5fb142','#98dc72'],['#529f36','#6bbb4a','#a8e582'],['#43912c','#58a93c','#8ed468'],['#5aa83c','#74c353','#b3ea8c']];
 const tufts=[];
 const addTuft=(x,y,scale)=>{if(hidden(x,y))return;const n=1+Math.floor(rnd()*rnd()*6)+ (rnd()<.5?1:0),spread=.5+rnd()*1.1,bl=[];
  for(let k=0;k<n;k++){const u=n===1?0:k/(n-1)-.5;bl.push({off:u*(1.6+n*.5)+(rnd()-.5)*.8,dx:u*spread*5+(rnd()-.5)*1.8,h:(3.2+rnd()*3.2)*(1-.3*Math.abs(u)),w:1.15+rnd()*.75,front:rnd()<.45})}
  tufts.push({x,y,s:scale*vert,flip:rnd()<.5?-1:1,shade:SHADES[Math.floor(rnd()*SHADES.length)],bl})};
 for(let i=0,N=Math.round(L.w*L.h/340);i<N;i++){const x=L.x0+rnd()*L.w,y=L.y0+rnd()*L.h,sc=.95+rnd()*.85;
  addTuft(x,y,sc);if(rnd()<.4)for(let k=1+Math.floor(rnd()*3);k>0;k--)addTuft(x+(rnd()-.5)*14,y+(rnd()-.5)*6,sc*(.6+rnd()*.5))}
 tufts.sort((a,b)=>a.y-b.y);
 const blade=(x,y,dx,h,w)=>{ctx.beginPath();ctx.moveTo(x-w,y);ctx.quadraticCurveTo(x-w*.2+dx*.2,y-h*.6,x+dx,y-h);ctx.quadraticCurveTo(x+w*.6+dx*.3,y-h*.5,x+w,y);ctx.closePath();ctx.fill()};
 for(const t of tufts){const s=t.s,f=t.flip,[dark,mid,light]=t.shade;
  ctx.fillStyle='rgba(40,90,20,.16)';ctx.beginPath();ctx.ellipse(t.x+1,t.y+.4,(2+t.bl.length*1.2)*s,1.4*s,0,0,7);ctx.fill();
  for(const b of t.bl.filter(b=>!b.front)){ctx.fillStyle=dark;blade(t.x+b.off*s*f,t.y,b.dx*s*f,b.h*s,b.w*s*.85)}
  for(const b of t.bl.filter(b=>b.front)){ctx.fillStyle=mid;blade(t.x+b.off*s*f,t.y,b.dx*s*f,b.h*s,b.w*s);ctx.fillStyle=light;blade(t.x+b.off*s*f+.2*s,t.y-b.h*s*.3,b.dx*s*f*.8,b.h*s*.7,b.w*s*.3)}
  if(!t.bl.some(b=>b.front)){const b=t.bl[0];ctx.fillStyle=light;blade(t.x+b.off*s*f,t.y-b.h*s*.35,b.dx*s*f*.7,b.h*s*.6,b.w*s*.25)}

 // Flowers in small clusters, kept away from the path and from every sculpture (and the ground it hides).
 const KINDS=[{petal:'#ffffff',core:'#ffd23f',n:6,r:2},{petal:'#ffd84d',core:'#ffffff',n:5,r:1.9},{petal:'#ff8cc0',core:'#fff2a8',n:5,r:1.9},{petal:'#a98bff',core:'#fff2a8',n:5,r:1.9}];

  return FOOTPRINTS.some(F=>{for(let t=0;t<=F.tall;t+=8){const q=[x,y+t];if(polyDist(q,F.ps)<14)return true}return false})};
 const fl=[];
 for(let k=0;k<L.w*L.h/14000;k++){const cx=L.x0+rnd()*L.w,cy=L.y0+rnd()*L.h,K=KINDS[Math.floor(rnd()*KINDS.length)],n=3+Math.floor(rnd()*6);

// Map units at scroll 0 (the canvas is painted in these coordinates).
function mapToScreen0(p){const x=dot(p,[ca,-sa,0])*CAMERA.scale+CAMERA.origin[0],y=dot(p,[sa,ca,0])*CAMERA.scale*se+CAMERA.origin[1];return[x,y]}
let lawnSrc=null,lawnView=null;
// Every screen row is one line of constant depth on the ground, and along it the map→screen mapping is linear.
// So the lawn is drawn as thin horizontal strips with plain 2D drawImage: exact perspective, no 3D layers, cheap per frame.
function placeLawn(){
 if(!lawnSrc)return;
 const cw=lawnView.clientWidth,chh=lawnView.clientHeight,dpr=Math.min(3,devicePixelRatio||1),k=cw/390;
 if(lawnView.width!==Math.round(cw*dpr)||lawnView.height!==Math.round(chh*dpr)){lawnView.width=Math.round(cw*dpr);lawnView.height=Math.round(chh*dpr)}

  const a=applyH(Hi,[0,ys]),b=applyH(Hi,[390,ys]),c=applyH(Hi,[0,ys+dy]);
  const sx=(a[0]-L.x0)*r,sw=(b[0]-a[0])*r,sy=(a[1]-L.y0)*r,sh=Math.max(.5,(c[1]-a[1])*r);
  if(sy<0||sy+sh>lawnSrc.height||sx<0||sx+sw>lawnSrc.width)continue;
  ctx.drawImage(lawnSrc,sx,sy,sw,sh,0,ys,390,dy+.6);

}

const FOOTPRINTS=PROPS.map(P=>({ps:(typeof P.plinth==='object'?plinthFor(P).bottom:ring(P.center,P.radius,0)).map(mapToScreen0),tall:P.tall||40}));

// ---------- Render for the current camera position ----------
const REPEAT='<path d="M-7 -1.5A7.2 7.2 0 0 1 5.6 -4.6"/><path d="M6.4 -9.2 5.9 -4.2 1.2 -5.6"/><path d="M7 1.5A7.2 7.2 0 0 1 -5.6 4.6"/><path d="M-6.4 9.2 -5.9 4.2 -1.2 5.6"/>';
const STAR=Array.from({length:10},(_,k)=>{const r=k%2?7.5:17,t=-Math.PI/2+k*Math.PI/5;return `${k?'L':'M'}${f(r*Math.cos(t))} ${f(r*Math.sin(t))}`}).join('')+'Z';
const onScreen=p=>{if(PERSPECTIVE&&toCamera(p)[2]>CAMERA.distance*.7)return false;const q=project(p);return q[1]>-160&&q[1]<1020};
// Stage transition: nodes and sculptures of a stage pop up from their base as it scrolls in (staggered along the path).
const CALM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stageVis=s=>1-Math.min(1,Math.abs(CURRENT_SCROLL-s*SCREEN)/SCREEN);
const easeOutBack=t=>{const c1=1.25,c3=c1+1;return 1+c3*(t-1)**3+c1*(t-1)**2};
function popOf(stage,k){if(CALM)return{s:1,o:1};const t=Math.max(0,Math.min(1,(stageVis(stage)-.3-k*.025)/.45));return{s:t>=1?1:easeOutBack(t),o:Math.min(1,t*1.8)}}
const popWrap=(svg,base,p)=>p.s>=1&&p.o>=1?svg:(p.o<=.01?'':`<g transform="translate(${f(base[0])} ${f(base[1])}) scale(${f(Math.max(.001,p.s))}) translate(${f(-base[0])} ${f(-base[1])})" opacity="${f(p.o)}">${svg}</g>`);
const fx={kite:document.querySelector('.fx .kite'),kiteG:document.querySelector('.fx .kite g'),glow:document.querySelector('.fx .glow')};
function render(){
 defs='';uid=0;
 let ground='';const objects=[];let air=null,lamp=null,here=null;
 const trophyOf=s=>PROPS.find(P=>P.trophy&&P.stage===s);
 // Path dots on the ground: light up to the current node; each stage's path ends at its trophy.
 const segs=lessons.slice(1).map((c,i)=>[i,i+1]).filter(([a,b])=>NODES[a].stage===NODES[b].stage).map(([a,b])=>({a:lessons[a],b:lessons[b],ra:radiusOf(a),rb:radiusOf(b),lit:a<CURRENT,stage:NODES[a].stage,k:a}));
 STAGES.forEach((S,s)=>{const last=NODES.map((N,i)=>i).filter(i=>NODES[i].stage===s).pop(),T=trophyOf(s);segs.push({a:lessons[last],b:T.center,ra:radiusOf(last),rb:T.plinth.r,lit:last<CURRENT,stage:s,k:8})});

  if(!onScreen(g.a)&&!onScreen(g.b))return;
  const p=popOf(g.stage,g.k);if(p.o<.5)return;
  const d=sub(g.b,g.a),len=Math.hypot(d[0],d[1]),u=scaleV(d,1/len),from=g.ra+7,to=len-g.rb-10,n=Math.max(1,Math.round((to-from)/9));
  const fill=GRASS?(g.lit?'#fff1a8':'#f7fbf2'):(g.lit?'#9fcf78':'#c7d8e3');
  for(let k=0;k<=n;k++){const q=add(g.a,scaleV(u,from+(to-from)*k/n));ground+=poly(ring(q,2.1,0).filter((_,j)=>j%7===0),fill)}
 });
 lessons.forEach((c,i)=>{
  if(!onScreen(c))return;
  const r=radiusOf(i),th=NODES[i].lesson?TILE_HEIGHT:6,top=add(c,[0,0,th]),p=popOf(NODES[i].stage,NODES[i].k),base=project(c);
  ground+=popWrap(shadowShape([...ring(c,r,0),...ring(c,r,th)],c,top)+contact(c,r),base,p);
  // Lessons carry their number within the stage; reviews are smaller and carry a repeat icon.
  const mark=NODES[i].lesson?label(0,8,lessonNumber(i),24,i>CURRENT?'fill-opacity=".72"':''):`<g fill="none" stroke="${i>CURRENT?'#8aa3b5':'#245271'}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${REPEAT}</g>`;
  objects.push({depth:depthOf(c),svg:popWrap(cylinder(c,r,th,material(i))+`<g transform="${frameAt(top,scaleV(RIGHT,1/CAMERA.scale),scaleV(TOWARD_VIEWER,1/CAMERA.scale))}">${mark}</g>`,base,p)});
 });

 });

 document.querySelector('#objects').innerHTML=objects.map(o=>o.svg).join('');
 document.querySelector('#dyn').innerHTML=defs;

}
// Overlays live outside the big SVG, so their gentle animations are composited and never repaint the scene.
function placeFx(air,lamp,here){
 const k=document.querySelector('svg.scene').clientWidth/390;
 fx.kiteG.innerHTML=air?air.svg:'';
 if(air)fx.kite.style.transformOrigin=`${f(air.pivot[0]*k)}px ${f(air.pivot[1]*k)}px`;
 fx.glow.style.opacity=lamp?lamp.o:0;
 if(lamp)fx.glow.style.transform=`translate(${f(lamp.at[0]*k)}px,${f(lamp.at[1]*k)}px)`;
}
// Stage header inside the top card: which stage is on screen and how far along it is.
function updateStageBar(){

 document.querySelector('.stage-name').textContent=`Etapa ${s+1}`;

}

// ---------- Scrolling: the svg is the camera viewport, the scroller only supplies the offset ----------
const scroller=document.querySelector('.scroller'),spacer=document.querySelector('.spacer');
const unitsPerPx=()=>390/scroller.clientWidth;
spacer.innerHTML=STAGES.map(()=>'<div class="stage-snap"></div>').join('');
const fit=()=>{spacer.style.height='auto';spacer.querySelectorAll('.stage-snap').forEach(d=>d.style.height=(SCREEN/unitsPerPx())+'px')};
let queued=false;
scroller.addEventListener('scroll',()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;setScroll(scroller.scrollTop*unitsPerPx());render()})},{passive:true});
addEventListener('resize',()=>{fit();setScroll(scroller.scrollTop*unitsPerPx());render()});
if(GRASS){lawnSrc=paintLawn();lawnView=document.createElement('canvas');lawnView.className='lawn';document.querySelector('.phone').insertBefore(lawnView,document.querySelector('svg.scene'))}
fit();
const startAt=+params.get('scroll')||0;scroller.scrollTop=startAt/unitsPerPx();setScroll(startAt);render();
document.querySelector('#note').textContent=PERSPECTIVE?'камера: перспектива · ?camera=ortho — параллельная':'камера: параллельная · без параметра — перспектива';

const earnedToday=params.get('today')!=='0';
const days=/^\d{1,3}$/.test(params.get('days')||'')?params.get('days'):'3';
const series=document.querySelector('.series');series.querySelector('strong').textContent=days;series.classList.toggle('inactive',!earnedToday);series.setAttribute('aria-label',`Serie de ${days} días; ${earnedToday?'experiencia ganada hoy':'sin experiencia hoy'}`);

// Runnable geometry checks.
const near=(a,b,e=1e-8)=>Math.abs(a-b)<e;
// Check ordering and facing with the camera parked over each object, as the user will see it.
console.assert(lessons.slice(1).every((c,i)=>{setScroll(mapY(i)-CAMERA.origin[1]+35);return project(c)[1]>project(lessons[i])[1]}),'Lessons descend from top to bottom');
console.assert(lessons.every(c=>near(c[2],0)),'Every lesson stands on the ground');
console.assert(PROPS.filter(P=>P.kind===prismProp||P.kind===lettersProp).every(P=>{setScroll(P.at[1]-CAMERA.origin[1]);return facesCamera(rotateZ(P.kind===prismProp?[0,1,0]:TOWARD_VIEWER,P.yaw),P.center)}),'Every sculpture faces the viewer');
console.assert(NODES.every((N,i)=>mapY(i)>=N.stage*SCREEN+STAGE_TOP-1&&mapY(i)<=N.stage*SCREEN+STAGE_BOTTOM+1),'Every stage fits one screen');
console.assert(STAGES.every((S,s)=>NODES.filter(N=>N.stage===s&&N.lesson).length===3),'Three lessons per stage');
// Bays: no sculpture may overlap a lesson platform on the ground.
console.assert(PROPS.every(P=>lessons.every(c=>Math.hypot(c[0]-P.center[0],c[1]-P.center[1])>RADIUS+(P.kind===prismProp?P.radius:30))),'Sculptures sit in free bays');
setScroll(0);
console.assert(near(project(TARGET)[0],CAMERA.origin[0])&&near(project(TARGET)[1],CAMERA.origin[1]),'Camera target sits at the screen origin');
console.assert(!PERSPECTIVE||project(add(TARGET,[0,0,0]))[1]>project(add(TARGET,scaleV(TOWARD_VIEWER,-200)))[1],'Farther ground is higher on screen');
console.assert(near(castShadow([25,35,0])[0],25)&&near(castShadow([25,35,0])[1],35),'Shadow touches every ground contact');
{const d=sub(project(castShadow([0,0,20])),project([0,0,0]));console.assert(d[0]>0&&d[1]<0,'Light from upper-left: shadows fall back and to the right')}
console.assert(near(intensity([0,0,1]),1),'Top faces keep their material colour');
setScroll(startAt);
