      outfit: { key: 'outfit', tab: 'Ropa', title: 'Ropa', icon: 'M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-1 1.5-2.5 2-4 2s-3-.5-4-2Z',
        items: [['tee', 'Remera'], ['hoodie', 'Buzo GM', R('lessons', 10, '10 lecciones')]],
        colors: { key: 'shirt', title: 'Color', list: [['#2d63d6', 'Azul'], ['#f5c230', 'Amarillo'], ['#58c0ec', 'Celeste'], ['#e2574c', 'Rojo'], ['#4fa83a', 'Verde'], ['#1d2b4f', 'Marino']] } },
      bg: { key: 'bg', tab: 'Fondo', title: 'Fondo', icon: 'M4 4h16v16H4Z M4 15l5-5 5 5 2-2 4 4', items: [],
        colors: { key: 'bg', title: 'Color de fondo', list: [['#dfe8fb', 'Azul claro'], ['#fff1c9', 'Amarillo claro'], ['#d9f3e4', 'Verde claro'], ['#fde0e8', 'Rosa claro'], ['#e7defc', 'Lila'], ['#e3f6fd', 'Celeste claro']] } }
    };
    var ORDER = ['expr', 'hair', 'hat', 'glasses', 'outfit', 'bg'];
    var unlocked = function (req) {
      if (!req) return true;
      if (req.kind === 'xp') return ME.xp >= req.n;
      if (req.kind === 'lessons') return ME.lessons >= req.n;
      return false;
    };
    var progressOf = function (req) {
      if (req.kind === 'xp') return { pct: Math.min(100, Math.round(ME.xp / req.n * 100)), text: ME.xp + ' / ' + req.n + ' XP', left: 'Te faltan ' + (req.n - ME.xp) + ' XP' };
      if (req.kind === 'lessons') return { pct: Math.round(ME.lessons / req.n * 100), text: ME.lessons + ' / ' + req.n, left: 'Completa ' + (req.n - ME.lessons) + ' lecciones más' };
      if (req.kind === 'stage') return { pct: 11, text: '1 / 9', left: 'Termina la Etapa 1' };
      return { pct: 0, text: '0%', left: 'Domina el tema ' + req.n };
    };
    var withPart = function (key, val) { var o = {}; for (var k in look) o[k] = look[k]; o[key] = val; return o; };
    var setLook = function (key, val) { return function () { self.setState({ look: withPart(key, val), hint: null }); }; };

    var cat = CATS[s.tab];
    var countOf = function (c) {
      var real = c.items.filter(function (x) { return x[0] !== 'none'; });
      var u = real.filter(function (x) { return unlocked(x[2]); }).length;
      return { u: u, t: real.length };
    };
    var tabs = ORDER.map(function (id) {
      var c = CATS[id]; var on = s.tab === id; var cnt = countOf(c);
      return {
        label: c.tab, d: c.icon, on: on, pick: function () { self.setState({ tab: id }); },
        count: cnt.t ? cnt.u + '/' + cnt.t : '',
        countStyle: cnt.t ? ('font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 999px; ' + (on ? 'background: rgba(255,255,255,0.25); color: #ffffff' : 'background: #e3e8ef; color: #5d6a82')) : 'display: none',
        style: 'flex-shrink: 0; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0px 14px 0px 12px; border: none; border-radius: 999px; cursor: pointer; font-weight: 900; font-size: 15px; ' +
          (on ? 'background: #2d63d6; color: #ffffff; box-shadow: 0 4px 0 #1f4ba8' : 'background: #f1f4f8; color: #4b5870; box-shadow: 0 4px 0 #dfe5ee')
      };
    });

    var T = {};
    ORDER.forEach(function (cid) {
      var c = CATS[cid];
      c.items.forEach(function (x) {
        var id = x[0], req = x[2], ok = unlocked(req), sel = look[c.key] === id;
        var border = sel ? 'border: 3px solid #2d63d6; background: #eef4ff; box-shadow: 0 5px 0 #2d63d6' : (ok ? 'border: 3px solid #e6ebf2; background: #ffffff; box-shadow: 0 5px 0 #dfe5ee' : 'border: 3px solid #eef1f5; background: #f7f9fc; box-shadow: 0 5px 0 #e6ebf2');
        T[cid + '_' + id] = {
          selected: sel, locked: !ok,
          headStyle: 'width: 72px; height: 72px; border-radius: 50%; overflow: hidden; flex-shrink: 0; ' + (ok ? '' : 'filter: grayscale(0.9); opacity: 0.55'),
          tileStyle: 'position: relative; height: 162px; border-radius: 22px; cursor: pointer; padding: 12px 6px 10px 6px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; color: #1d2b4f; ' + border,
          pick: ok ? setLook(c.key, id) : function () { self.setState({ hint: { cat: cid, id: id } }); }
        };
      });
    });
    var colors = cat.colors ? cat.colors.list.map(function (c) {
      var on = look[cat.colors.key] === c[0];
      return {
        label: c[1], on: on, pick: setLook(cat.colors.key, c[0]),
        style: 'width: 46px; height: 46px; justify-self: center; border-radius: 50%; cursor: pointer; padding: 0px; display: flex; align-items: center; justify-content: center; background: ' + c[0] + '; ' +
          (on ? 'border: 4px solid #ffffff; box-shadow: 0 0 0 3px #2d63d6, 0 5px 0 3px #1f4ba8' : 'border: 3px solid rgba(29,43,79,0.08); box-shadow: 0 4px 0 rgba(29,43,79,0.14)')
      };
    }) : [];

    var target = null;
    if (s.hint) {
      var hc = CATS[s.hint.cat];
      hc.items.forEach(function (x) { if (x[0] === s.hint.id) target = { cat: hc, item: x }; });
    }
    var kicker = target ? ('Bloqueado · ' + target.item[2].text) : 'Próximo premio';
    if (!target) {
      var best = null;
      ORDER.forEach(function (id) { CATS[id].items.forEach(function (x) { if (x[2] && x[2].kind === 'xp' && !unlocked(x[2]) && (!best || x[2].n < best.item[2].n)) best = { cat: CATS[id], item: x }; }); });
      target = best;
    }
    var pr = progressOf(target.item[2]);
    var banner = {
      kicker: kicker,
      title: target.item[1],
      progress: pr.text,
      barStyle: 'width: ' + Math.max(4, pr.pct) + '%; height: 8px; border-radius: 999px; background: #f5c230',
      look: withPart(target.cat.key, target.item[0])
    };

    var cc = countOf(cat);
    var pool = function (c) { return c.items.filter(function (x) { return unlocked(x[2]); }).map(function (x) { return x[0]; }); };
    var any = function (a) { return a[Math.floor(Math.random() * a.length)]; };
    return {
      a: headVals(look), b: headVals(withBgLook(banner.look)), T: T, banner: banner, tabs: tabs, colors: colors,
      hasColors: colors.length > 0,
      tab_expr: s.tab === 'expr', tab_hair: s.tab === 'hair', tab_hat: s.tab === 'hat', tab_glasses: s.tab === 'glasses', tab_outfit: s.tab === 'outfit',
      sectionTitle: cat.title, sectionCount: cc.t ? cc.u + ' de ' + cc.t + ' desbloqueados' : '',
      colorsTitle: cat.colors ? cat.colors.title : '',
      randomize: function () {
        self.setState({ hint: null, look: {
          skin: any(CATS.expr.colors.list)[0], hair: any(CATS.hair.colors.list)[0], shirt: any(CATS.outfit.colors.list)[0], bg: any(CATS.bg.colors.list)[0],
          hairStyle: any(pool(CATS.hair)), expr: any(pool(CATS.expr)), hat: any(pool(CATS.hat)), glasses: any(pool(CATS.glasses)), outfit: any(pool(CATS.outfit))
        } });
      }
    };
  }
}
</script>
