<div class="stage"><div class="examples" id="examples" role="group" aria-label="Другой пример" hidden></div><section class="device" aria-label="Экран урока"><div class="statusline"><span>2:56</span><span>◆ ▰ ▰</span></div><div class="apphead"><a class="back" href="/" aria-label="Назад к Android"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6.2 11H15M6.2 11l4.6-4.6M6.2 11l4.6 4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></a><h1 id="app-title"></h1><button class="language" type="button" aria-label="Язык макета: русский">RU</button></div><div class="progress" aria-label="Прогресс сценария"><i id="progress-fill"></i></div><div class="scroller" id="scroller"></div><div class="dock" id="dock"></div></section></div>

<script>
const menu=document.querySelector('#menu-list'),appTitle=document.querySelector('#app-title'),scroller=document.querySelector('#scroller'),dock=document.querySelector('#dock'),guide=document.querySelector('#guide'),fill=document.querySelector('#progress-fill'),examplesBar=document.querySelector('#examples');
const concepts=[
 {title:'1. Прямоугольный треугольник',short:'Урок 1 · Треугольник',description:'Что означает 90°, как называются стороны и почему гипотенуза всегда напротив прямого угла.',blocks:[
  {title:'В треугольнике три стороны и три угла',text:'Угол — место, где встречаются две стороны. Посмотри на три вершины фигуры.',art:'vertices'},
  {title:'Прямой угол равен 90°',text:'Его отмечают маленьким квадратом. Две стороны у этой вершины встречаются под 90°.',art:'right'},
  {title:'Сравни две фигуры',text:'Нажми на треугольник с прямым углом. Его можно узнать по маленькому квадрату у вершины.',art:'compare',type:'choice',options:[['a','Фигура A'],['b','Фигура B']],correct:'a',good:'В фигуре A маленький квадрат показывает угол 90°.',bad:'У выбранной фигуры нет квадратной отметки. Посмотри на другую.'},
  {title:'Это прямоугольный треугольник',text:'Если один угол треугольника равен 90°, треугольник называют прямоугольным. Второго прямого угла у него быть не может.',art:'right'},
  {title:'Две стороны у 90° — катеты',text:'Посмотри на две синие стороны, которые образуют прямой угол. Это катеты.',art:'catheti'},
  {title:'Сторона напротив 90° — гипотенуза',text:'Она соединяет два оставшихся угла и не касается вершины с отметкой 90°. На рисунке она оранжевая.',art:'hypotenuse'},
  {title:'Повернём треугольник на 180°',text:'Теперь прямой угол вверху слева. Он всё ещё между двумя катетами, а гипотенуза остаётся напротив него.',art:'rotated'},
  {title:'Проверь названия сторон',text:'Выбери верное объяснение катетов и гипотенузы.',art:'labeled',type:'choice',options:[['good','Катеты образуют 90°, гипотенуза напротив'],['wrong1','Гипотенуза образует 90° с катетом'],['wrong2','Любую сторону можно назвать гипотенузой']],correct:'good',good:'Верно: две стороны у 90° — катеты, напротив — гипотенуза.',bad:'Найди квадратную отметку: какие стороны к ней подходят?'}
 ]},
 {title:'2. Треугольники в жизни',short:'Урок 2 · На схеме',description:'Одна ясная схема показывает, как знакомый треугольник увидеть в предмете.',blocks:[
  {title:'Сначала ищем знакомую фигуру',text:'Из первого урока мы уже знаем признак: один угол равен 90°.',art:'right'},
  {title:'На чертеже пандуса тоже есть три стороны',text:'Основание горизонтально, высота вертикальна, наклонная часть соединяет их концы.',art:'ramp'},
  {title:'Основание и высота образуют 90°',text:'Поэтому синие линии на чертеже — прямоугольный треугольник.',art:'ramp-right'},
  {title:'Найди прямой угол на схеме',text:'Какие две линии встречаются под 90°?',art:'ramp-right',type:'choice',options:[['baseheight','Основание и высота'],['baseslope','Основание и наклон'],['heightslope','Высота и наклон']],correct:'baseheight',good:'Да. Горизонтальная и вертикальная линии дают 90°.',bad:'Посмотри на горизонталь и вертикаль.'},
  {title:'Наклонная сторона лежит напротив 90°',text:'На геометрической схеме это гипотенуза. Названия сторон работают так же, как в первом уроке.',art:'ramp-hyp'},
  {title:'Проверь перенос на схему',text:'Какая линия соответствует гипотенузе?',art:'ramp-hyp',type:'choice',options:[['slope','Наклонная'],['base','Основание'],['height','Высота']],correct:'slope',good:'Верно. Наклонная линия напротив 90°.',bad:'Гипотенуза не подходит к вершине с прямым углом.'}
 ]},
 {title:'3. Измерение с треугольником',short:'Урок 3 · Данные',description:'Ученик сначала различает известные длины и искомую сторону на чистой схеме.',blocks:[
  {title:'Числа на сторонах — это данные',text:'На схеме длина одного катета 4, а гипотенузы 5. Каждое число относится к своей линии.',art:'known'},
  {title:'Знак вопроса — неизвестная длина',text:'Мы ещё не знаем длину второго катета. Поэтому рядом с ним стоит ?.',art:'unknown'},
  {title:'Какие длины уже известны?',text:'Выбери только данные, записанные числами.',art:'unknown',type:'choice',options:[['45','4 и 5'],['4q','4 и ?'],['5q','5 и ?']],correct:'45',good:'Да. Числа 4 и 5 — известные длины.',bad:'Знак ? пока не число.'},
  {title:'Перед решением называем цель',text:'Известные стороны уже подписаны. Найти нужно только сторону с вопросительным знаком.',art:'unknown'},
  {title:'Другие числа — тот же порядок действий',text:'Если на другой схеме стоят 6 и 10, а третья сторона помечена ?, сначала тоже отделяем известное от искомого.',art:'other-numbers'},
  {title:'Что именно нужно найти?',text:'Посмотри на первую схему и выбери искомую сторону.',art:'unknown',type:'choice',options:[['vertical','Вертикальный катет'],['base','Катет длиной 4'],['hyp','Гипотенузу длиной 5']],correct:'vertical',good:'Да. Знак ? стоит у вертикального катета.',bad:'Искомую сторону показывает знак ?.'}
 ]}
];
const taskDefinitions=[
 {title:'Коснись стороны',short:'Касание стороны',description:'Оставляем для начальных тем. Пример переключается между гипотенузой и двумя катетами.',examples:['Гипотенуза','Два катета']},
 {title:'Собери из блоков',short:'Сборка блоков',description:'Те же места для блоков подходят синусу, косинусу и тангенсу.',examples:['Синус','Косинус','Тангенс']},
 {title:'Заполни шаг',short:'Один пропуск',description:'Одно действие для разных тем: угол, отношение сторон, известные данные.',examples:['Угол','Синус','Данные']},
 {title:'Найди ошибку',short:'Исправление',description:'Найти неверную строку и выбрать точное исправление.',examples:['Синус','Прямой угол']},
 {title:'Поставь по порядку',short:'Порядок шагов',description:'Собрать ход рассуждения перед вычислением.',examples:['Прямой угол','Синус']},
 {title:'Отметь все верные',short:'Несколько ответов',description:'Новый тип: выбрать все верные утверждения, а не один ответ.',examples:['Треугольник','Синус']},
 {title:'Сравни и объясни',short:'Выбор с причиной',description:'Новый тип: выбрать правильный рисунок или запись и отдельно указать почему.',examples:['Прямой угол','Синус']}
];
let section='concepts',lesson=0,task=0,example=0;
let conceptState=concepts.map(()=>({visible:1,answer:null,feedback:null,verified:new Set()}));
let taskState={};
function newTaskState(){taskState={selected:null,many:new Set(),slots:{top:null,bottom:null},line:null,fix:null,order:[1,0,2],reason:null,feedback:null,correct:false,chip:null}}
newTaskState();
function triangleSvg(kind,selected=null){
 const base=kind==='hypotenuse'?'faint':'side',vertical=base,hyp=kind==='hypotenuse'?'orange':kind==='catheti'?'faint':'side';
 const values=kind==='known'||kind==='unknown'?'<text x="154" y="189">4</text><text x="284" y="98">?</text><text x="140" y="85">5</text>':kind==='other-numbers'?'<text x="154" y="189">6</text><text x="284" y="98">?</text><text x="140" y="85">10</text>':kind==='sine'?'<text x="154" y="189">4</text><text x="284" y="98">3</text><text x="140" y="85">5</text>':'';
 const letters=kind==='labeled'?'<text x="150" y="188">A</text><text x="280" y="100">B</text><text x="137" y="87">C</text>':'';
 const vertices=kind==='vertices'?'<circle cx="28" cy="163" r="5" fill="#eea44b"/><circle cx="270" cy="163" r="5" fill="#eea44b"/><circle cx="270" cy="18" r="5" fill="#eea44b"/>':'';
 const targets=kind==='touch'?`<path data-side="base" ${selected==='base'?'class="selected"':''} d="M28 163H270" role="button" tabindex="0" aria-label="Нижняя сторона"/><path data-side="vertical" ${selected==='vertical'?'class="selected"':''} d="M270 163V18" role="button" tabindex="0" aria-label="Вертикальная сторона"/><path data-side="hyp" ${selected==='hyp'?'class="selected"':''} d="M28 163L270 18" role="button" tabindex="0" aria-label="Наклонная сторона"/>`:'';
 return `<svg viewBox="0 0 320 205" role="${targets?'group':'img'}" aria-label="Прямоугольный треугольник"><path class="${base}" d="M28 163H270"/><path class="${vertical}" d="M270 163V18"/><path class="${hyp}" d="M28 163L270 18"/>${kind==='vertices'?'':'<path class="marker" d="M247 163v-23h23"/><text x="224" y="132" fill="#bc7820">90°</text>'}${kind==='sine'?'<text x="42" y="148">α</text>':''}${values}${letters}${vertices}${targets}</svg>`
}
function touchSvg(picked){const sides=[['base','M24 400H290','Нижняя сторона'],['vertical','M290 400V25','Вертикальная сторона'],['hyp','M24 400L290 25','Наклонная сторона']];return `<svg viewBox="0 0 320 430" role="group" aria-label="Прямоугольный треугольник">${sides.map(([id,d])=>`<path class="side${picked.has(id)?' picked':''}" d="${d}"/>`).join('')}<path class="marker" d="M265 400v-25h25"/><text x="225" y="363">90°</text>${sides.map(([id,d,label])=>`<path data-side="${id}" d="${d}" role="button" tabindex="0" aria-pressed="${picked.has(id)}" aria-label="${label}"/>`).join('')}</svg>`}
function compareArt(selected=null){return `<div class="diagram-pair"><button type="button" class="figure-choice" data-figure="a" aria-label="Выбрать фигуру A" aria-pressed="${selected==='a'}"><b>Фигура A</b><svg viewBox="0 0 150 110" aria-hidden="true"><path class="side" d="M15 90H130V15Z"/><path class="marker" d="M115 90V75h15"/></svg></button><button type="button" class="figure-choice" data-figure="b" aria-label="Выбрать фигуру B" aria-pressed="${selected==='b'}"><b>Фигура B</b><svg viewBox="0 0 150 110" aria-hidden="true"><path class="side" d="M15 88L115 88L73 15Z"/></svg></button></div>`}
function rampArt(kind){return `<svg viewBox="0 0 320 205" role="img" aria-label="Геометрическая схема пандуса"><path d="M20 164H286M270 164V22" stroke="#c5d7e7" stroke-width="14" stroke-linecap="round"/><path d="M30 164L270 22" stroke="#eea44b" stroke-width="11" stroke-linecap="round"/><path class="${kind==='ramp-hyp'?'faint':'side'}" d="M30 164H270V22"/><path class="${kind==='ramp-hyp'?'orange':'side'}" d="M30 164L270 22"/><path class="marker" d="M246 164v-24h24"/><text x="104" y="190">основание</text><text x="274" y="95">высота</text><text x="99" y="81">наклон</text></svg>`}
function art(kind,selected=null){if(kind==='compare')return compareArt(selected);if(kind.startsWith('ramp'))return rampArt(kind);if(kind==='rotated')return `<div class="diagram-pair"><div><b>До поворота</b>${triangleSvg('right')}</div><div><b>Поворот на 180° ↻</b><svg viewBox="0 0 320 205" role="img" aria-label="Тот же треугольник после поворота на 180 градусов"><path class="side" d="M42 33H284M42 33V178"/><path class="side" d="M284 33L42 178"/><path class="marker" d="M42 56h23V33"/><text x="76" y="63">90°</text></svg></div></div>`;return triangleSvg(kind)}
function menuItems(){const list=section==='concepts'?concepts:taskDefinitions;menu.innerHTML=list.map((x,i)=>`<button type="button" class="menu-item" role="tab" data-item="${i}" aria-selected="${i===(section==='concepts'?lesson:task)}"><strong>${x.short}</strong><small>${section==='concepts'?x.title:x.title}</small></button>`).join('');menu.querySelectorAll('[data-item]').forEach(b=>{b.addEventListener('click',()=>pickItem(Number(b.dataset.item)));b.addEventListener('keydown',e=>{const i=Number(b.dataset.item),n=list.length;const next=e.key==='ArrowRight'||e.key==='ArrowDown'?(i+1)%n:e.key==='ArrowLeft'||e.key==='ArrowUp'?(i+n-1)%n:e.key==='Home'?0:e.key==='End'?n-1:null;if(next!==null){e.preventDefault();pickItem(next);menu.querySelector(`[data-item="${next}"]`).focus()}})})}
function pickItem(i){if(section==='concepts')lesson=i;else{task=i;example=0;newTaskState()}render();document.querySelector('.device').scrollIntoView({block:'nearest'})}
function setSection(next){section=next;document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===next)));document.querySelector('#menu-heading').textContent=next==='concepts'?'Первые три урока':'Типы заданий';document.querySelector('#menu-description').textContent=next==='concepts'?'Блоки остаются выше по ленте.':'Каждый тип можно применить к другой теме.';render();document.querySelector('.device').scrollIntoView({block:'nearest'})}
function guideContent(){const item=section==='concepts'?concepts[lesson]:taskDefinitions[task];guide.innerHTML=`<div class="label">${section==='concepts'?'Концепт урока':'Тип задания'}</div><h2>${item.title}</h2><p>${item.description}</p><p class="note">Браузерный прототип. Тексты здесь на русском для проверки обучения; курс Android и прогресс не меняются.</p>`}
function card(block,i,selected){return `<article class="learning-card" data-card="${i}"><h2>${block.title}</h2><p>${block.text}</p><div class="art">${art(block.art,selected)}</div></article>`}
function optionButtons(options,selected,multi=false){return `<div class="answers" role="group" aria-label="Варианты ответа">${options.map(([id,label])=>`<button type="button" class="answer" data-option="${id}" aria-pressed="${multi?selected.has(id):selected===id}">${label}</button>`).join('')}</div>`}
function feedbackHtml(message,correct,solution){return message?`<div class="feedback ${correct?'good':'bad'}" role="status"><p>${correct?'✓':'↻'} ${message}</p><button class="solution-toggle" type="button">Показать решение</button><p class="solution-text" hidden>${solution}</p></div>`:''}
function actionDock(body,label,disabled,onAction){dock.innerHTML=`${body||''}<div class="dockrow">${section==='concepts'?`<button class="help robot" type="button" id="tutor" aria-label="Спросить тьютора про этот урок">${robotIcon}</button>`:`<button class="help" type="button" id="help" aria-label="Подсказка"><svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h6M10 23h4M12 2a7 7 0 0 0-4 13c.8.6 1 1.4 1 2h6c0-.6.2-1.4 1-2A7 7 0 0 0 12 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>`}<button class="primary" type="button" id="action" ${disabled?'disabled':''}>${label}</button></div>`;dock.querySelector('#action').addEventListener('click',onAction);dock.querySelector('.solution-toggle')?.addEventListener('click',e=>{const explanation=dock.querySelector('.solution-text');explanation.hidden=!explanation.hidden;e.currentTarget.textContent=explanation.hidden?'Показать решение':'Скрыть решение';document.body.style.setProperty('--dock-space',`${dock.offsetHeight+20}px`)});dock.querySelector('#tutor')?.addEventListener('click',openTutor);dock.querySelector('#help')?.addEventListener('click',()=>{const old=dock.querySelector('.hint');if(old){old.remove();return}const hint=document.createElement('div');hint.className='hint';hint.textContent=section==='concepts'?'Прочитай последний блок и обрати внимание на рисунок.':'Сверь выбранный ответ со схемой и условием.';dock.prepend(hint)});document.body.style.setProperty('--dock-space',`${dock.offsetHeight+24}px`)}
function renderConcept(){examplesBar.hidden=true;examplesBar.innerHTML='';const c=concepts[lesson],s=conceptState[lesson],blocks=c.blocks;appTitle.textContent=c.title;fill.style.width=`${Math.round(s.visible/blocks.length*100)}%`;scroller.innerHTML=blocks.slice(0,s.visible).map((block,i)=>card(block,i,i===s.visible-1?s.answer:null)).join('');const current=blocks[s.visible-1],complete=s.verified.has(s.visible-1);let body='';if(current.type){body=s.feedback?feedbackHtml(s.feedback,complete,current.good):current.art==='compare'?'':optionButtons(current.options,s.answer);dock.dataset.mode='concept-check'}else dock.dataset.mode='concept-text';const label=current.type&&!complete?(s.feedback?'Исправить ответ':'Проверить ответ'):s.visible===blocks.length?(lesson<2?'К уроку '+(lesson+2)+' →':'К заданиям →'):'Продолжить';actionDock(body,label,!!current.type&&!complete&&!s.answer,()=>{if(current.type&&!complete){if(s.feedback){s.feedback=null;s.answer=null;renderConcept();return}const ok=s.answer===current.correct;s.feedback=ok?current.good:current.bad;if(ok)s.verified.add(s.visible-1);renderConcept();return}if(s.visible<blocks.length){s.visible++;s.answer=null;s.feedback=null;renderConcept();requestAnimationFrame(()=>scroller.scrollTo({top:scroller.lastElementChild.offsetTop,behavior:'smooth'}))}else if(lesson<2){lesson++;render();document.querySelector('.device').scrollIntoView({block:'nearest'})}else setSection('tasks')});dock.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{s.answer=b.dataset.option;s.feedback=null;renderConcept()}));scroller.querySelectorAll('[data-figure]').forEach(b=>b.addEventListener('click',()=>{if(complete)return;s.answer=b.dataset.figure;s.feedback=null;renderConcept()}))}
const robotIcon='<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v3"/><circle cx="12" cy="2.5" r=".6" fill="currentColor"/><rect x="4.5" y="5.5" width="15" height="12" rx="4"/><circle cx="9.2" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11" r="1.3" fill="currentColor" stroke="none"/><path d="M9.5 14.5h5M2.5 10.5v3M21.5 10.5v3M8.5 17.5v3h7v-3"/></svg>';
const backIcon='<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6.2 11H15M6.2 11l4.6-4.6M6.2 11l4.6 4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
// Prototype of the Tutor screen opened from a concept: the lesson and the current block travel as the only context.
function openTutor(){const c=concepts[lesson],st=conceptState[lesson],b=c.blocks[st.visible-1],device=document.querySelector('.device');device.querySelector('.tutor')?.remove();const sheet=document.createElement('div');sheet.className='tutor';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label','Чат с тьютором');
 sheet.innerHTML=`<div class="apphead"><button class="back" type="button" data-close aria-label="Вернуться к уроку">${backIcon}</button><h1>Тьютор</h1></div><div class="tutor-context"><span class="tutor-clip">${robotIcon}</span><div><small>Вопрос по уроку</small><b>${c.title}</b><span>Блок ${st.visible} из ${c.blocks.length} · ${b.title}</span></div></div><div class="tutor-log" aria-live="polite"><p class="bubble bot">Я вижу, что ты сейчас на блоке «${b.title}». Что здесь непонятно?</p></div><div class="tutor-suggest">${['Объясни проще','Почему это так?','Покажи другой пример'].map(q=>`<button type="button" data-q>${q}</button>`).join('')}</div><form class="tutor-input"><input type="text" maxlength="300" placeholder="Спроси про этот урок…" aria-label="Вопрос тьютору"><button class="send" type="submit" aria-label="Отправить">↑</button></form><p class="tutor-note">Вопрос уйдёт онлайн-тьютору через интернет вместе с названием урока и блока. Ответ не меняет прогресс.</p>`;
 device.append(sheet);const log=sheet.querySelector('.tutor-log'),input=sheet.querySelector('input'),opener=document.querySelector('#tutor');
 const ask=q=>{q=q.trim();if(!q)return;log.insertAdjacentHTML('beforeend',`<p class="bubble me"></p><p class="bubble bot">Прототип: здесь тьютор ответит с учётом урока «${c.title}» и блока «${b.title}».</p>`);log.querySelectorAll('.bubble.me')[log.querySelectorAll('.bubble.me').length-1].textContent=q;input.value='';log.scrollTop=log.scrollHeight};
 const close=()=>{sheet.remove();opener?.focus()};
 sheet.querySelector('[data-close]').addEventListener('click',close);sheet.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 sheet.querySelectorAll('[data-q]').forEach(x=>x.addEventListener('click',()=>ask(x.textContent)));sheet.querySelector('form').addEventListener('submit',e=>{e.preventDefault();ask(input.value)});input.focus()}
function presets(names){return `Пример в прототипе:${names.map((name,i)=>`<button class="preset" data-example="${i}" type="button" aria-pressed="${example===i}">${name}</button>`).join('')}`}
function taskCard(title,text,visual,extra=''){return `<article class="learning-card task-card"><h2>${title}</h2><p class="instruction">${text}</p><div class="art">${visual}</div>${extra}</article>`}
function taskData(){switch(task){case 0:return example===0?{title:'Коснись гипотенузы',text:'Она лежит напротив отметки 90°.',target:'hyp'}:{title:'Отметь оба катета',text:'Они встречаются у отметки 90°.',target:'both'};case 1:return [['Синус','sin α','opposite','hyp'],['Косинус','cos α','adjacent','hyp'],['Тангенс','tan α','opposite','adjacent']][example];case 2:return [['Прямой угол равен…',[['90','90°'],['45','45°'],['180','180°']],'90'],['Если напротив α — 3, а гипотенуза — 5, то sin α = …',[['3/5','3/5'],['5/3','5/3'],['4/5','4/5']],'3/5'],['Знак ? на стороне означает…',[['unknown','искомую длину'],['known','известную длину'],['angle','угол']],'unknown']][example];case 3:return example===0?{lines:['Катет напротив α равен 3.','Гипотенуза равна 5.','sin α = 5/3.'],wrong:2,fix:[['3/5','sin α = 3/5'],['5/3','sin α = 5/3'],['4/5','sin α = 4/5']],correct:'3/5'}:{lines:['Вижу квадратную отметку угла.','Этот угол равен 180°.','Треугольник прямоугольный.'],wrong:1,fix:[['90','Угол равен 90°'],['180','Угол равен 180°'],['45','Угол равен 45°']],correct:'90'};case 4:return example===0?['Найти квадратную отметку','Проверить, что угол равен 90°','Назвать треугольник прямоугольным']:['Выбрать угол α','Найти катет напротив α','Разделить его длину на гипотенузу'];case 5:return example===0?{question:'Какие утверждения верны?',options:[['a','У прямоугольного треугольника есть угол 90°'],['b','У него три стороны'],['c','Все его углы равны 90°'],['d','Гипотенуза образует прямой угол']],correct:['a','b']}:{question:'Что верно для синуса?',options:[['a','sin α = напротив / гипотенуза'],['b','Для sin α нужен выбранный угол'],['c','sin α = гипотенуза / напротив'],['d','sin α не зависит от сторон']],correct:['a','b']};default:return example===0?{question:'Какая фигура прямоугольная?',options:[['a','Фигура A'],['b','Фигура B']],correct:'a',reasons:[['square','Есть отметка 90°'],['long','У неё длиннее сторона']],reason:'square'}:{question:'Какая запись синуса верна?',options:[['a','3/5'],['b','5/3']],correct:'a',reasons:[['ratio','Напротив α делим на гипотенузу'],['reverse','Гипотенузу делим на катет']],reason:'ratio'}}}
function taskCorrect(){const d=taskData(),s=taskState;switch(task){case 0:return d.target==='hyp'?s.selected==='hyp':s.many.has('base')&&s.many.has('vertical')&&s.many.size===2;case 1:return s.slots.top===d[2]&&s.slots.bottom===d[3];case 2:return s.selected===d[2];case 3:return s.line===d.wrong&&s.fix===d.correct;case 4:return s.order.every((v,i)=>v===i);case 5:return s.many.size===d.correct.length&&d.correct.every(v=>s.many.has(v));default:return s.selected===d.correct&&s.reason===d.reason}}
function taskSolution(){const d=taskData();switch(task){case 0:return example===0?'Гипотенуза — наклонная сторона напротив угла 90°.':'Нижняя и вертикальная стороны образуют угол 90°.';case 1:return `${d[1]}: ${d[2]==='opposite'?'катет напротив α':'катет рядом с α'} / ${d[3]==='hyp'?'гипотенуза':'катет рядом с α'}.`;case 2:return d[1].find(([id])=>id===d[2])[1];case 3:return d.fix.find(([id])=>id===d.correct)[1];case 4:return d.join(' → ');case 5:return d.options.filter(([id])=>d.correct.includes(id)).map(([,label])=>label).join('; ');default:return `${d.options.find(([id])=>id===d.correct)[1]}. ${d.reasons.find(([id])=>id===d.reason)[1]}.`}}
function submitTask(){const ok=taskCorrect();taskState.correct=ok;taskState.feedback=ok?'Верно. Пример решён.':'Проверь выбор ещё раз по схеме и условию.';renderTask()}
function taskActionEnabled(){const s=taskState;switch(task){case 0:return example===0?!!s.selected:s.many.size>0;case 1:return !!s.slots.top&&!!s.slots.bottom;case 2:return !!s.selected;case 3:return s.line!==null&&!!s.fix;case 4:return true;case 5:return s.many.size>0;default:return !!s.selected&&!!s.reason}}
function bindPresets(){examplesBar.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>{example=Number(b.dataset.example);newTaskState();renderTask();scroller.scrollTop=0}))}
function bindTaskOptions(){dock.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.option;if(task===5||task===0&&example===1){if(taskState.many.has(id))taskState.many.delete(id);else taskState.many.add(id)}else taskState.selected=id;taskState.feedback=null;taskState.correct=false;renderTask()}));dock.querySelectorAll('[data-reason]').forEach(b=>b.addEventListener('click',()=>{taskState.reason=b.dataset.reason;taskState.feedback=null;taskState.correct=false;renderTask()}));dock.querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>{taskState.chip=b.dataset.chip;renderTask()}));dock.querySelectorAll('[data-fix]').forEach(b=>b.addEventListener('click',()=>{taskState.fix=b.dataset.fix;taskState.feedback=null;taskState.correct=false;renderTask()}))}
function renderTask(){const d=taskData(),s=taskState,x=taskDefinitions[task],oldTop=scroller.scrollTop;appTitle.textContent=x.title;fill.style.width=s.correct?'100%':'0%';let cardHtml='',dockBody='';const preset=presets(x.examples);
 if(task===0){const one=example===0;cardHtml=taskCard(d.title,d.text,touchSvg(one?new Set(s.selected?[s.selected]:[]):s.many));dockBody=`<div class="tiny-label">${one?'Коснись стороны прямо на рисунке.':'Коснись обеих сторон у 90° прямо на рисунке.'}</div>`}
 else if(task===1){const names={opposite:'Напротив α',adjacent:'Рядом с α',hyp:'Гипотенуза'};cardHtml=taskCard('Собери '+d[0].toLowerCase()+' из блоков','Выбери слово снизу, затем место в дроби.',`<div class="build">${triangleSvg('sine')}<div class="fraction-box"><small>Сверху · числитель</small><div class="fraction"><span>${d[1]} =</span><div class="slots${s.chip?' ready':''}"><button class="slot${s.slots.top?'':' empty'}" data-slot="top" type="button" aria-label="Числитель: ${names[s.slots.top]||'пусто'}">${names[s.slots.top]||'—'}</button><hr><button class="slot${s.slots.bottom?'':' empty'}" data-slot="bottom" type="button" aria-label="Знаменатель: ${names[s.slots.bottom]||'пусто'}">${names[s.slots.bottom]||'—'}</button></div></div><small>Снизу · знаменатель</small></div></div>`);dockBody=`<div class="answers grid2">${Object.entries(names).map(([id,name])=>`<button type="button" class="answer" data-chip="${id}" aria-pressed="${s.chip===id}">${name}</button>`).join('')}</div>`}
 else if(task===2){cardHtml=taskCard('Заполни один шаг',d[0],triangleSvg(example===2?'unknown':example===1?'sine':'right'));dockBody=optionButtons(d[1],s.selected)}
 else if(task===3){cardHtml=taskCard('Найди неверную строку','Затем выбери её исправление внизу.',triangleSvg(example===0?'sine':'right'),`<div>${d.lines.map((text,i)=>`<button class="line-choice" type="button" data-line="${i}" aria-pressed="${s.line===i}"><b>${i+1}</b>${text}</button>`).join('')}</div>`);dockBody=`<div class="tiny-label">Исправление</div><div class="answers">${d.fix.map(([id,label])=>`<button class="answer" type="button" data-fix="${id}" aria-pressed="${s.fix===id}">${label}</button>`).join('')}</div>`}
 else if(task===4){cardHtml=taskCard('Поставь шаги по порядку','Стрелки двигают шаг на одну строку.',triangleSvg('right'),`<div>${s.order.map((id,i)=>`<div class="order-row"><span>${i+1}. ${d[id]}</span><button type="button" data-move="${i}:up" aria-label="Поднять шаг ${i+1}" ${i===0?'disabled':''}>↑</button><button type="button" data-move="${i}:down" aria-label="Опустить шаг ${i+1}" ${i===2?'disabled':''}>↓</button></div>`).join('')}</div>`)}
 else if(task===5){cardHtml=taskCard(d.question,'Правильных ответов может быть больше одного.',triangleSvg(example===0?'right':'sine'));dockBody=optionButtons(d.options,s.many,true)}
 else{cardHtml=taskCard(d.question,'Сначала выбери ответ, затем объясни причину.',example===0?compareArt(s.selected):triangleSvg('sine'));dockBody=`${example===0?'':`<div class="tiny-label">Ответ</div>${optionButtons(d.options,s.selected)}`}<div class="tiny-label">Почему?</div><div class="answers">${d.reasons.map(([id,label])=>`<button class="answer" type="button" data-reason="${id}" aria-pressed="${s.reason===id}">${label}</button>`).join('')}</div>`}
 examplesBar.innerHTML=preset;examplesBar.hidden=false;scroller.innerHTML=cardHtml;if(s.feedback)dockBody=feedbackHtml(s.feedback,s.correct,taskSolution());const label=s.correct?'Следующее задание':s.feedback?'Исправить ответ':'Проверить ответ';actionDock(dockBody,label,!s.correct&&!taskActionEnabled(),()=>{if(s.correct){if(example+1<x.examples.length){example++;newTaskState();renderTask()}else if(task+1<taskDefinitions.length){task++;example=0;newTaskState();render()}else{task=0;example=0;newTaskState();render()};document.querySelector('.device').scrollIntoView({block:'nearest'})}else if(s.feedback){s.feedback=null;renderTask()}else submitTask()});bindPresets();bindTaskOptions();scroller.querySelectorAll('[data-figure]').forEach(b=>b.addEventListener('click',()=>{if(s.correct)return;s.selected=b.dataset.figure;s.feedback=null;s.correct=false;renderTask()}));scroller.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>{if(!s.chip)return;const place=b.dataset.slot,other=place==='top'?'bottom':'top';if(s.slots[other]===s.chip)s.slots[other]=null;s.slots[place]=s.chip;s.chip=null;s.feedback=null;s.correct=false;renderTask()}));scroller.querySelectorAll('[data-line]').forEach(b=>b.addEventListener('click',()=>{s.line=Number(b.dataset.line);s.feedback=null;s.correct=false;renderTask()}));scroller.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const [index,dir]=b.dataset.move.split(':');const i=Number(index),j=i+(dir==='up'?-1:1);[s.order[i],s.order[j]]=[s.order[j],s.order[i]];s.feedback=null;s.correct=false;renderTask()}));scroller.querySelectorAll('[data-side]').forEach(b=>{const choose=()=>{const id=b.dataset.side;if(task===0&&example===1){if(s.many.has(id))s.many.delete(id);else s.many.add(id)}else s.selected=id;s.feedback=null;s.correct=false;renderTask()};b.addEventListener('click',choose);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})})}
function render(){document.querySelector('.tutor')?.remove();menuItems();guideContent();if(section==='concepts')renderConcept();else renderTask();if(typeof fitPhone==='function')fitPhone()}
function fitPhone(){const top=document.querySelector('.device').getBoundingClientRect().top+scrollY;document.documentElement.style.setProperty('--phone-scale',String(Math.max(.5,Math.min(1,(innerHeight-top-16)/935))))}
addEventListener('resize',fitPhone);fitPhone();
document.querySelectorAll('[data-section]').forEach(b=>{b.addEventListener('click',()=>setSection(b.dataset.section));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();setSection(section==='concepts'?'tasks':'concepts');document.querySelector(`[data-section="${section}"]`).focus()}})});
render();
</script>
