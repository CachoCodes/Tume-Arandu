<script>
// Orthographic camera. Azimuth 45°, elevation 40°.
// All scene positions are world (x,y,z); UI chrome alone is screen space.
const radians=degrees=>degrees*Math.PI/180;
const CAMERA={azimuth:radians(45),elevation:radians(40),scale:Math.sqrt(1.5),origin:[195,429]};
const ca=Math.cos(CAMERA.azimuth),sa=Math.sin(CAMERA.azimuth),ce=Math.cos(CAMERA.elevation),se=Math.sin(CAMERA.elevation);
const vector=([x,y,z=0])=>[CAMERA.scale*(ca*x-sa*y),CAMERA.scale*(se*(sa*x+ca*y)-ce*z)];
const project=p=>{const v=vector(p);return[v[0]+CAMERA.origin[0],v[1]+CAMERA.origin[1]]};
const onGround=([px,py])=>{const x=(px-CAMERA.origin[0])/CAMERA.scale,y=(py-CAMERA.origin[1])/(CAMERA.scale*se);return[ca*x+sa*y,-sa*x+ca*y,0]};
const points=ps=>ps.map(p=>p.join(',')).join(' ');
const poly=(ps,fill,extra='')=>`<polygon points="${points(ps.map(project))}" fill="${fill}" ${extra}/>`;
const label=(x,y,s,size=11,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="650" ${extra}>${s}</text>`;
const add=(a,b)=>a.map((v,i)=>v+(b[i]||0));
// Rotate only the object around its vertical axis; camera and ground stay fixed.
const rotateZ=([x,y,z=0],angle)=>[x*Math.cos(angle)-y*Math.sin(angle),x*Math.sin(angle)+y*Math.cos(angle),z];
const localToWorld=(origin,angle,p)=>add(origin,rotateZ(p,angle));
// One light for contact and cast shadows on z=0.
// Key light sits behind the viewer, higher than the camera (55° elevation).
const lightElevation=radians(55);
const LIGHT=[sa*Math.cos(lightElevation),ca*Math.cos(lightElevation),Math.sin(lightElevation)];
const VIEW=[sa*ce,ca*ce,se];
const dot=(a,b)=>a.reduce((sum,v,i)=>sum+v*b[i],0);
const castShadow=([x,y,z=0])=>[x-z*LIGHT[0]/LIGHT[2],y-z*LIGHT[1]/LIGHT[2],0];
const shade=(hex,normal,angle=0)=>{const intensity=.58+.42*Math.max(0,dot(rotateZ(normal,angle),LIGHT));return '#'+hex.slice(1).match(/../g).map(c=>Math.round(parseInt(c,16)*intensity).toString(16).padStart(2,'0')).join('')};
const visible=(normal,angle)=>dot(rotateZ(normal,angle),VIEW)>0;
const TRIANGLE_YAW=radians(-25);
const shadow=ps=>poly(ps.map(castShadow),'#315c7d24','filter="url(#shadow)"');
// Compact descending layout; all positions still use the same world camera.
const columns=[140,140,195,250,250,195,140];
const lessons=columns.map((x,i)=>onGround([x,190+i*70]));
const RADIUS=30,SEGMENTS=64;
const circleFootprint=(c,z=0)=>Array.from({length:SEGMENTS},(_,i)=>add(c,[RADIUS*Math.cos(i*2*Math.PI/SEGMENTS),RADIUS*Math.sin(i*2*Math.PI/SEGMENTS),z]));
let tiles='';lessons.forEach((c,i)=>{
 const height=6,top=circleFootprint(c,height),base=circleFootprint(c);
 const material=i<2?'#bde797':i===2?'#d7f2ff':'#edf4f8';
 tiles+=shadow(top)+poly(base,'#41677d55','stroke="#41677d33" stroke-width="1"');
 // A cylindrical platform: visible side normals and all vertices use the restored camera.
 for(let k=0;k<SEGMENTS;k++){const j=(k+1)%SEGMENTS,angle=(k+.5)*2*Math.PI/SEGMENTS,normal=[Math.cos(angle),Math.sin(angle),0];if(dot(normal,VIEW)>0)tiles+=poly([top[k],top[j],base[j],base[k]],shade(material,normal));}
 tiles+=poly(top,shade(material,[0,0,1]),'stroke="#f4fbff" stroke-width=".65"');
 // Surface lettering: baseline parallel to the camera, compressed by the ground tilt.
 const p=project(add(c,[0,0,height]));const flat=Math.sin(CAMERA.elevation);
 tiles+=`<g transform="matrix(1 0 0 ${flat} ${p[0]} ${p[1]})">`+label(0,8,i+1,24);
 tiles+='</g>';
});document.querySelector('#tiles').innerHTML=tiles;
// Vertical lettering on a world plane (local u horizontal, local -z down).
function verticalMatrix(origin,angle,depth=0){const p=project(localToWorld(origin,angle,[0,depth,0])),u=vector(rotateZ([1,0,0],angle)),down=vector([0,0,-1]);return `matrix(${u[0]} ${u[1]} ${down[0]} ${down[1]} ${p[0]} ${p[1]})`}
// A single teaching sculpture, with the same matte material and circular footing as lessons.
const PROP_CENTER=onGround([88,444]);
function propBase(){
 const ring=z=>Array.from({length:SEGMENTS},(_,i)=>add(PROP_CENTER,[46*Math.cos(i*2*Math.PI/SEGMENTS),46*Math.sin(i*2*Math.PI/SEGMENTS),z]));
 const top=ring(5),base=ring(0),material='#e5f2fa';
 let s=shadow(top);
 for(let k=0;k<SEGMENTS;k++){
  const j=(k+1)%SEGMENTS,a=(k+.5)*2*Math.PI/SEGMENTS,normal=[Math.cos(a),Math.sin(a),0];
  if(dot(normal,VIEW)>0)s+=poly([top[k],top[j],base[j],base[k]],shade(material,normal));
 }
 return s+poly(top,shade(material,[0,0,1]),'stroke="#f4fbff" stroke-width=".8"');
}
function triangle(){
 const angle=TRIANGLE_YAW,width=70,height=width/Math.sqrt(3),scale=1.2;
 const world=p=>localToWorld(PROP_CENTER,angle,[(p[0]-width/2)*scale,p[1]+5,(p[2]||0)*scale+5]);
 const front=[[0,0,0],[width,0,0],[width,0,height]].map(world),back=[[0,-10,0],[width,-10,0],[width,-10,height]].map(world);
 const material='#d7f2ff',edge='stroke="#afcfdf" stroke-width=".8" stroke-linejoin="round"';
 let s='';
 if(visible([1,0,0],angle))s+=poly([front[1],back[1],back[2],front[2]],shade(material,[1,0,0],angle),edge);
 const normal=[-.5,0,Math.sqrt(3)/2];
 if(visible(normal,angle))s+=poly([front[0],back[0],back[2],front[2]],shade(material,normal,angle),edge);
 s+=poly(front,shade(material,[0,1,0],angle));
 s+=`<g transform="${verticalMatrix(world([0,0,0]),angle)} scale(${scale})">`;
 // Keep the geometry legible at map scale: angle, three side lengths, right-angle mark.
 s+=`<path d="M59 0v-10h11" fill="none" stroke="#648da6" stroke-width="1.1" stroke-linejoin="round"/>`;
 s+=label(25,-4,'30°',7)+label(44,-4,'√3',7)+label(61,-27,'60°',6)+label(64,-17,'1',7)+label(44,-16,'2',7)+'</g>';
 return s;
}
document.querySelector('#props').innerHTML=propBase()+triangle();
const params=new URLSearchParams(location.search),earnedToday=params.get('today')!=='0';
const days=/^\d{1,3}$/.test(params.get('days')||'')?params.get('days'):'3';
const series=document.querySelector('.series');series.querySelector('strong').textContent=days;series.classList.toggle('inactive',!earnedToday);series.setAttribute('aria-label',`Serie de ${days} días; ${earnedToday?'experiencia ganada hoy':'sin experiencia hoy'}`);
document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>document.querySelector('#note').textContent=`${b.getAttribute('aria-label')} · только визуальный макет`);
console.assert(lessons.slice(1).every((c,i)=>project(c)[1]>project(lessons[i])[1]),'Lessons descend from top to bottom');
// Runnable geometry checks: detect projection, footprint and yaw regressions.
const near=(a,b)=>Math.abs(a-b)<1e-8;
const axis=vector([46,0,0]);console.assert(near(Math.atan2(axis[1],axis[0]),Math.atan(Math.sin(CAMERA.elevation))),'Ground axis must follow camera elevation');
console.assert(lessons.every(c=>circleFootprint(c).every(p=>near(Math.hypot(p[0]-c[0],p[1]-c[1]),RADIUS)&&near(p[2],0))),'All lesson platforms have circular ground contact');
console.assert(lessons.every(c=>onGround(project(c)).every((v,i)=>near(v,c[i]))),'World/screen roundtrip');
console.assert(near(Math.hypot(...rotateZ([104,0,0],TRIANGLE_YAW)),104),'Z rotation preserves triangle length');
// Camera and depth invariants across the complete map.
const diagonals=lessons.map(c=>{const ps=circleFootprint(c,6).map(project);return[Math.hypot(ps[8][0]-ps[40][0],ps[8][1]-ps[40][1]),Math.hypot(ps[24][0]-ps[56][0],ps[24][1]-ps[56][1])]});
console.assert(diagonals.every(d=>d.every((v,i)=>near(v,diagonals[0][i]))),'All seven platforms have identical scale and tilt');
console.assert(visible([0,1,0],TRIANGLE_YAW),'Triangle front faces the viewer');
console.assert(near(castShadow([25,35,0])[0],25)&&near(castShadow([25,35,0])[1],35),'Shadow touches every ground contact');
console.assert(vector(castShadow([0,0,20]))[1]<0&&dot(LIGHT,VIEW)>0,'Light is behind viewer; shadows extend away');
</script>
